spring:
  datasource:
    # 本地开发库：专用容器 agentwriter-postgres 映射在宿主机 5433 端口（5432 被其他项目占用）
    url: jdbc:postgresql://localhost:5433/agentwriter
    username: postgres
    password: agentwriter
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

agentwriter:
  topic:
    proxy-host: 127.0.0.1
    proxy-port: 7890
  llm:
    enabled: true
    provider: agnes
    api-url: https://apihub.agnes-ai.com/v1
    api-key: 
    model: agnes-2.5-flash
    timeout: 120
  embedding:
    enabled: false
  image:
    enabled: false
    comfy-base-url: http://localhost:8188
    workflow-template:
    storage-directory: data/generated-images
    poll-interval-millis: 1000
    timeout-seconds: 300
  publisher:
    wechat:
      enabled: false
      app-id:
      app-secret:
      api-base-url: https://api.weixin.qq.com
      author: 林哈哈
      thumb-media-id:

