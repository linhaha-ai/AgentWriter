# AgentWriter 前端生产服务：静态资源托管 + 后端反向代理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文本类资源 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker 内嵌 DNS：按请求解析 backend 服务名，
    # 后端容器重建（IP 变化）后无需重启 nginx 即可恢复转发
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8080;

    # SSE 事件流（/api/articles/ 下的 events 与 progress）：
    # 必须关闭响应缓冲并放宽读取超时，与 README 中的反向代理要求一致
    location /api/articles/ {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 其余 API 请求（含同步生成等长耗时接口，放宽读取超时）
    location /api/ {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # 资源图库本地图片（与开发代理的 /media 规则一致）
    location /media/ {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由回退：未命中静态文件时返回 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 首页不缓存，确保发版后浏览器立即加载新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
