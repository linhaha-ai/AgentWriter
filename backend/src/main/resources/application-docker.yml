# Docker 容器运行档：在 dev 档之上覆盖容器环境相关配置。
# 叠加激活方式：SPRING_PROFILES_ACTIVE=dev,docker
# - dev 档提供本机 LLM 密钥等开发配置
# - 本文件覆盖数据库连接（容器网内服务名）、外网代理与图片存储路径
spring:
  datasource:
    # compose 网络内通过服务名 postgres 访问数据库；
    # 手动 docker run 时可用 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD 覆盖
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:agentwriter}
    username: ${DB_USER:agentwriter}
    password: ${DB_PASSWORD:agentwriter_secret}
  jpa:
    hibernate:
      # schema 完全交给 Flyway 管理：禁止 Hibernate 抢先建表，
      # 否则幂等迁移脚本（IF NOT EXISTS）会因表已存在被跳过导致迁移残缺。
      # compose 会额外以 SPRING_JPA_HIBERNATE_DDL_AUTO 环境变量兜底（优先级最高）。
      ddl-auto: none

agentwriter:
  topic:
    # 外网代理：容器内默认直连。仅监听 127.0.0.1 的宿主代理（如 127.0.0.1:7890）
    # 容器无法访问；如需容器走代理，请让代理监听 0.0.0.0 后在 docker/.env 配置
    # TOPIC_PROXY_HOST/TOPIC_PROXY_PORT。compose 会额外以命令行参数
    # --agentwriter.topic.proxy-host=... 兜底覆盖，确保不被 dev 档的 127.0.0.1 影响。
    proxy-host: ${TOPIC_PROXY_HOST:}
    proxy-port: ${TOPIC_PROXY_PORT:0}
  image:
    # 生成图片统一写入容器内挂载卷 /app/data（compose 卷 backend-data）
    storage-directory: /app/data/generated-images
