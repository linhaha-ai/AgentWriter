server:
  port: 8080

spring:
  application:
    name: agentwriter
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/agentwriter
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  # 数据库迁移由 Flyway 管理（Spring Boot 4 已移除 Flyway 自动配置，
  # 迁移在 com.agentwriter.config.FlywayConfig 中手动注册执行；
  # 迁移脚本统一位于 classpath:db/migration，V1 全量建库 + V2~V6 增量变更）。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      thread-name-prefix: async-

agentwriter:
  prompts:
    location: classpath:prompts/
    version: v1

  topic:
    rss-feeds: >
      https://news.ycombinator.com/rss
    use-llm: true
    proxy-host:
    proxy-port: 0

  research:
    search-url: "https://s.jina.ai/{topic}"
    max-sources: 5
    use-llm: true
    connect-timeout-seconds: 15
    response-timeout-seconds: 45

  llm:
    enabled: true
    provider: agnes
    api-url: https://apihub.agnes-ai.com/v1
    api-key:
    model: agnes-2.5-flash
    timeout: 120
  # Agnes 暂未提供 embedding 接口，RAG 默认使用 Stub（enabled=false）；如需启用，请接入兼容 OpenAI /embeddings 的服务。
  embedding:
    enabled: false
    api-url: https://apihub.agnes-ai.com/v1
    api-key:
    model: text-embedding-ada-002
    dimensions: 1536
    timeout: 30
  image:
    enabled: false
    comfy-base-url: http://localhost:8188
    workflow-template:
    storage-directory: data/generated-images
    poll-interval-millis: 1000
    timeout-seconds: 300
  publisher:
    wechat:
      enabled: false
      app-id:
      app-secret:
      api-base-url: https://api.weixin.qq.com
      author: 林哈哈
      thumb-media-id:
  schedule:
    enabled: true
    cron: 0 0 8 * * ?

logging:
  level:
    com.agentwriter: INFO
